name: Build RPM

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  version-check:
    name: Version Consistency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check version consistency
        run: |
          SPEC_VERSION=$(grep '^Version:' rpm/harbour-radiox.spec | awk '{print $2}')
          APPDATA_VERSION=$(grep -oP '<release\s+version="\K[^"]+' rpm/harbour-radiox.appdata.xml | head -1)
          echo "Spec version: $SPEC_VERSION"
          echo "AppData version: $APPDATA_VERSION"
          if [ "$SPEC_VERSION" != "$APPDATA_VERSION" ]; then
            echo "ERROR: Version mismatch! Spec=$SPEC_VERSION, AppData=$APPDATA_VERSION"
            exit 1
          fi

  build-rpm:
    name: Build RPM (${{ matrix.arch }})
    needs: version-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, armv7hl, i486]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build RPM package
        uses: R1tschY/sailfish-build-rpm@v1
        with:
          arch: ${{ matrix.arch }}
          release: '5.1.0.11'
          output-dir: ./rpms

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: harbour-radiox-${{ matrix.arch }}-rpm
          path: ./rpms/*.rpm
          if-no-files-found: error